name: release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: python -m pip install -e ".[dev]" ruff

      - name: Python lint
        run: python -m ruff check cdg_python_client --exclude cdg_python_client/__init__.pyi --ignore F403,F405

  python-type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install type-check dependencies
        run: python -m pip install -e ".[dev]" mypy

      - name: Python type check
        run: python -m mypy cdg_python_client/__init__.py --ignore-missing-imports --disable-error-code name-defined --disable-error-code used-before-def

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --all-targets --all-features

  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import venv

          venv_dir = pathlib.Path.cwd() / ".venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)

          scripts_dir = venv_dir / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"VIRTUAL_ENV={venv_dir}\n")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(f"{scripts_dir}\n")
          PY

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        run: maturin develop --release

      - name: Run Rust tests
        run: cargo test --tests -q

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import venv

          venv_dir = pathlib.Path.cwd() / ".venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)

          scripts_dir = venv_dir / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"VIRTUAL_ENV={venv_dir}\n")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(f"{scripts_dir}\n")
          PY

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        run: maturin develop --release

      - name: Run cargo check
        run: cargo check -q

      - name: Run unit tests
        run: pytest tests -q

  source-build-native:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-13
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import venv

          venv_dir = pathlib.Path.cwd() / ".venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)

          scripts_dir = venv_dir / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"VIRTUAL_ENV={venv_dir}\n")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(f"{scripts_dir}\n")
          PY

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        run: maturin develop --release

      - name: Run unit tests (source build)
        run: pytest tests -q

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        run: python -m pip_audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  codeql-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  integration:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import venv

          venv_dir = pathlib.Path.cwd() / ".venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)

          scripts_dir = venv_dir / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"VIRTUAL_ENV={venv_dir}\n")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(f"{scripts_dir}\n")
          PY

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        run: maturin develop --release

      - name: Run integration tests
        run: pytest test_integ/ -v

  pypy-compat:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.10"

      - name: Create virtual environment
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import venv

          venv_dir = pathlib.Path.cwd() / ".venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)

          scripts_dir = venv_dir / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"VIRTUAL_ENV={venv_dir}\n")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(f"{scripts_dir}\n")
          PY

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        run: maturin develop --release

      - name: Smoke test package on PyPy
        run: pytest tests/package_smoke.py -q

  build-linux-wheel:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          manylinux: "2014"
          args: --release --out dist
          sccache: "true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test wheel
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import venv

          artifact = next(pathlib.Path("dist").glob("*.whl"))
          tmpdir = pathlib.Path(tempfile.mkdtemp(prefix="cdg-wheel-smoke-"))
          venv_dir = tmpdir / "venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)
          python = venv_dir / ("Scripts/python.exe" if os.name == "nt" else "bin/python")

          subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
          subprocess.run(
              [str(python), "-I", str(pathlib.Path("tests/package_smoke.py").resolve())],
              cwd=tmpdir,
              check=True,
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist

  build-native-wheels:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-13
          - macos-14
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          sccache: "true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test wheel
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import venv

          artifact = next(pathlib.Path("dist").glob("*.whl"))
          tmpdir = pathlib.Path(tempfile.mkdtemp(prefix="cdg-wheel-smoke-"))
          venv_dir = tmpdir / "venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)
          python = venv_dir / ("Scripts/python.exe" if os.name == "nt" else "bin/python")

          subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
          subprocess.run(
              [str(python), "-I", str(pathlib.Path("tests/package_smoke.py").resolve())],
              cwd=tmpdir,
              check=True,
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  validate-linux-wheel:
    needs: build-linux-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.10"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke test Linux wheel
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import venv

          artifact = next(pathlib.Path("dist").glob("*.whl"))
          tmpdir = pathlib.Path(tempfile.mkdtemp(prefix="cdg-wheel-matrix-"))
          venv_dir = tmpdir / "venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)
          python = venv_dir / ("Scripts/python.exe" if os.name == "nt" else "bin/python")

          subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
          subprocess.run(
              [str(python), "-I", str(pathlib.Path("tests/package_smoke.py").resolve())],
              cwd=tmpdir,
              check=True,
          )
          PY

  build-sdist:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Smoke test sdist
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import tempfile
          import venv

          artifact = next(pathlib.Path("dist").glob("*.tar.gz"))
          tmpdir = pathlib.Path(tempfile.mkdtemp(prefix="cdg-sdist-smoke-"))
          venv_dir = tmpdir / "venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)
          python = venv_dir / "bin/python"

          subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
          subprocess.run(
              [str(python), "-I", str(pathlib.Path("tests/package_smoke.py").resolve())],
              cwd=tmpdir,
              check=True,
          )
          PY

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate-linux-wheel
      - build-linux-wheel
      - build-native-wheels
      - build-sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/cdg_python_client/
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
