name: release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install lint dependencies
        run: python -m pip install -e ".[dev]" ruff

      - name: Python lint
        run: python -m ruff check cdg_python_client --exclude cdg_python_client/__init__.pyi

  python-type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install type-check dependencies
        run: python -m pip install -e ".[dev]" mypy

      - name: Python type check
        run: python -m mypy cdg_python_client/__init__.py tests/test_public_api_contract.py --ignore-missing-imports --disable-error-code used-before-def --disable-error-code attr-defined

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build extension
        run: maturin develop --release

      - name: Run Rust tests
        run: cargo test --tests -q

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        run: maturin develop --release

      - name: Run cargo check
        run: cargo check -q

      - name: Run unit tests
        run: pytest tests -q

  source-build-native:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-13
          - windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        run: maturin develop --release

      - name: Run unit tests (source build)
        run: pytest tests -q

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        id: pip_audit
        shell: bash
        run: |
          set +e
          python -m pip_audit -f json -o pip-audit-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: cargo_audit
        shell: bash
        run: |
          set +e
          cargo audit --json > cargo-audit-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Convert pip-audit to SARIF
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("pip-audit-report.json")
          payload = {"dependencies": [], "vulns": []}
          if source.exists():
              payload = json.loads(source.read_text(encoding="utf-8"))

          results = []
          for dep in payload.get("dependencies", []):
              dep_name = dep.get("name", "unknown")
              dep_version = dep.get("version", "unknown")
              for vuln in dep.get("vulns", []):
                  vuln_id = vuln.get("id", "pip-audit")
                  fix_versions = ", ".join(vuln.get("fix_versions", [])) or "none"
                  results.append({
                      "ruleId": vuln_id,
                      "level": "error",
                      "message": {
                          "text": f"{dep_name} {dep_version} is affected by {vuln_id}; fixes: {fix_versions}"
                      },
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": "pyproject.toml"}
                          }
                      }],
                  })

          sarif = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "pip-audit",
                          "rules": [{"id": r["ruleId"], "name": r["ruleId"]} for r in results],
                      }
                  },
                  "results": results,
              }],
          }
          Path("pip-audit.sarif").write_text(json.dumps(sarif), encoding="utf-8")
          PY

      - name: Convert cargo-audit to SARIF
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("cargo-audit-report.json")
          payload = {"vulnerabilities": {"list": []}}
          if source.exists():
              payload = json.loads(source.read_text(encoding="utf-8"))

          advisories = payload.get("vulnerabilities", {}).get("list", [])
          results = []
          for advisory in advisories:
              info = advisory.get("advisory", {})
              package = advisory.get("package", {})
              adv_id = info.get("id", "cargo-audit")
              package_name = package.get("name", "unknown")
              package_version = package.get("version", "unknown")
              title = info.get("title", adv_id)
              results.append({
                  "ruleId": adv_id,
                  "level": "error",
                  "message": {
                      "text": f"{package_name} {package_version}: {title}"
                  },
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {"uri": "Cargo.lock"}
                      }
                  }],
              })

          sarif = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "cargo-audit",
                          "rules": [{"id": r["ruleId"], "name": r["ruleId"]} for r in results],
                      }
                  },
                  "results": results,
              }],
          }
          Path("cargo-audit.sarif").write_text(json.dumps(sarif), encoding="utf-8")
          PY

      - name: Upload pip-audit SARIF
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57
        with:
          sarif_file: pip-audit.sarif
          category: pip-audit

      - name: Upload cargo-audit SARIF
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57
        with:
          sarif_file: cargo-audit.sarif
          category: cargo-audit

      - name: Fail on dependency vulnerabilities
        shell: bash
        run: |
          if [ "${{ steps.pip_audit.outputs.exit_code }}" != "0" ] || [ "${{ steps.cargo_audit.outputs.exit_code }}" != "0" ]; then
            echo "Dependency vulnerabilities detected."
            exit 1
          fi

  codeql-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57
        with:
          languages: python, rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@03e4368ac7daa2bd82b3e85262f3bf87ee112f57

      - name: Analyze
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57

  integration:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        run: maturin develop --release

      - name: Run integration tests
        shell: bash
        run: |
          pytest test_integ/ -v || (
            echo "Integration tests failed on first attempt; retrying once..."
            pytest test_integ/ -v
          )

  pypy-compat:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "pypy3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        run: maturin develop --release

      - name: Smoke test package on PyPy
        run: pytest tests/package_smoke.py -q

  build-linux-wheel:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          manylinux: "2014"
          args: --release --out dist
          sccache: "true"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Smoke test wheel
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import venv

          artifact = next(pathlib.Path("dist").glob("*.whl"))
          tmpdir = pathlib.Path(tempfile.mkdtemp(prefix="cdg-wheel-smoke-"))
          venv_dir = tmpdir / "venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)
          python = venv_dir / ("Scripts/python.exe" if os.name == "nt" else "bin/python")

          subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
          subprocess.run(
              [str(python), "-I", str(pathlib.Path("tests/package_smoke.py").resolve())],
              cwd=tmpdir,
              check=True,
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-ubuntu-latest
          path: dist
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 7 }}

  build-native-wheels:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-13
          - macos-14
          - windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          args: --release --out dist
          sccache: "true"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Smoke test wheel
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import venv

          artifact = next(pathlib.Path("dist").glob("*.whl"))
          tmpdir = pathlib.Path(tempfile.mkdtemp(prefix="cdg-wheel-smoke-"))
          venv_dir = tmpdir / "venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)
          python = venv_dir / ("Scripts/python.exe" if os.name == "nt" else "bin/python")

          subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
          subprocess.run(
              [str(python), "-I", str(pathlib.Path("tests/package_smoke.py").resolve())],
              cwd=tmpdir,
              check=True,
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-${{ matrix.os }}
          path: dist
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 7 }}

  validate-linux-wheel:
    needs: build-linux-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.10"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wheels-ubuntu-latest
          path: dist

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke test Linux wheel
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import venv

          artifact = next(pathlib.Path("dist").glob("*.whl"))
          tmpdir = pathlib.Path(tempfile.mkdtemp(prefix="cdg-wheel-matrix-"))
          venv_dir = tmpdir / "venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)
          python = venv_dir / ("Scripts/python.exe" if os.name == "nt" else "bin/python")

          subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
          subprocess.run(
              [str(python), "-I", str(pathlib.Path("tests/package_smoke.py").resolve())],
              cwd=tmpdir,
              check=True,
          )
          PY

  build-sdist:
    needs:
      - python-lint
      - python-type
      - rust-lint
      - rust-tests
      - test
      - source-build-native
      - security-audit
      - codeql-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdist
          path: dist
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 30 || 7 }}

      - name: Smoke test sdist
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import tempfile
          import venv

          artifact = next(pathlib.Path("dist").glob("*.tar.gz"))
          tmpdir = pathlib.Path(tempfile.mkdtemp(prefix="cdg-sdist-smoke-"))
          venv_dir = tmpdir / "venv"
          venv.EnvBuilder(with_pip=True).create(venv_dir)
          python = venv_dir / "bin/python"

          subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
          subprocess.run(
              [str(python), "-I", str(pathlib.Path("tests/package_smoke.py").resolve())],
              cwd=tmpdir,
              check=True,
          )
          PY

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate-linux-wheel
      - build-linux-wheel
      - build-native-wheels
      - build-sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/cdg_python_client/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
