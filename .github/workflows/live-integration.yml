name: live-integration

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Check integration key availability
        id: key_check
        shell: bash
        run: |
          if [ -z "${CONGRESS_API_KEY}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CONGRESS_API_KEY is not configured; skipping integration run."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Cargo dependencies
        if: steps.key_check.outputs.available == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install test dependencies
        if: steps.key_check.outputs.available == 'true'
        run: python -m pip install -e ".[dev]"

      - name: Build extension
        if: steps.key_check.outputs.available == 'true'
        run: maturin develop --release

      - name: Run integration tests
        if: steps.key_check.outputs.available == 'true'
        shell: bash
        run: |
          pytest test_integ/ -q || (
            echo "Integration tests failed on first attempt; retrying once..."
            pytest test_integ/ -q
          )
